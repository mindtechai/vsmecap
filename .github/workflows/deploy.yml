name: Deploy VSMECAP
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend
        env:
          CI: false
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
      - name: Add CNAME
        run: |
          mkdir -p frontend/build
          if [ -f CNAME ]; then cp CNAME frontend/build/CNAME; else echo "vsmecap.com" > frontend/build/CNAME; fi
          ls -lh frontend/build | head -20
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
