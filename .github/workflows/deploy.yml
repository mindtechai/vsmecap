name: Deploy VSMECAP
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend
        env:
          CI: false
          GENERATE_SOURCEMAP: false
          DISABLE_ESLINT_PLUGIN: true
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          cd frontend
          cat > public/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8" /><link rel="icon" href="%PUBLIC_URL%/favicon.ico" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>VSMECAP</title></head><body><div id="root"></div></body></html>
          HTML
          rm -rf node_modules package-lock.json
          npm install -g yarn
          yarn install
          yarn build
          touch build/.nojekyll
          ls -lh build/ | tail -20
      - name: Add CNAME
        run: |
          if [ -f CNAME ]; then cp CNAME frontend/build/CNAME; else echo "vsmecap.com" > frontend/build/CNAME; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
